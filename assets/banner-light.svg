      <stop offset="1" stop-color="#E8F4F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0891B2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
